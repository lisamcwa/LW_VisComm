---
layout: default
---
<main class="project-page"><div class="wrap"><a class="back-link" href="{{ '/#work' | relative_url }}">← Back to portfolio</a><div class="eyebrow" style="margin-top:60px">{{ page.category | escape }} · {{ page.year | escape }}</div><h1>{{ page.title | escape }}</h1><p class="intro">{{ page.short_description | escape }}</p>{% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">{% endif %}<article class="project-story">{{ content }}</article><div style="margin-top:65px"><a class="btn" href="{{ '/#work' | relative_url }}">← All projects</a></div></div></main>
